# Supabase Configuration — Venue Guide
# Docs: https://supabase.com/docs/guides/local-development/cli/config

project_id = "venue-guide"

[api]
enabled = true
port = 54321
schemas = ["public", "auth", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_path = "./supabase/seed.sql"

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://venue-guide.vercel.app"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

[functions]
enabled = true

[functions.api]
enabled = true
verify_jwt = false  # Allow public access to event data; auth handled in function

[analytics]
enabled = false
