# ============================================================
# GitHub Actions — Deploy to Supabase
# ============================================================
# Required SECRETS in GitHub Environment "prod":
#   Settings → Environments → prod → Environment secrets
#
#   SUPABASE_ACCESS_TOKEN  — from https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_ID    — Project Reference ID (Settings → General)
#   SUPABASE_DB_PASSWORD   — Database password
# ============================================================

name: Deploy to Supabase

on:
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID:   ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase Project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Run Database Migrations
        run: supabase db push

      - name: Deploy Edge Functions
        run: supabase functions deploy api --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt

      - name: Deploy Complete
        run: echo "✅ Venue Guide backend deployed to Supabase!"
