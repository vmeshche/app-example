# ============================================================
# GitHub Actions — Deploy to Supabase
# ============================================================
# Required SECRETS in GitHub:
#   Settings → Secrets and variables → Actions → Secrets → New repository secret
#
#   SUPABASE_ACCESS_TOKEN  — from https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_ID    — Project Reference ID (Settings → General)
#   SUPABASE_DB_PASSWORD   — Database password
# ============================================================

name: Deploy to Supabase

on:
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: SUPABASE_ACCESS_TOKEN

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Debug — Verify secrets presence
        run: |
          echo "PROJECT_ID length: ${#PROJECT_ID}"
          echo "TOKEN length: ${#TOKEN}"
          echo "DB_PASS length: ${#DB_PASS}"
          if [ -z "$TOKEN" ]; then
            echo "ERROR: SUPABASE_ACCESS_TOKEN is empty!"
            exit 1
          fi
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          DB_PASS: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Login to Supabase
        run: supabase login --token "$TOKEN"
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Link Supabase Project
        run: supabase link --project-ref "$PROJECT_ID"
        env:
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Run Database Migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy Edge Functions
        run: supabase functions deploy api --project-ref "$PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Deploy Complete
        run: echo "✅ Venue Guide backend deployed to Supabase!"
